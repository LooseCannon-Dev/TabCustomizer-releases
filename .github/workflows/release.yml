# GitHub 릴리스를 만들고 확장 압축 파일을 첨부한다.
# - Actions 화면에서 'Run workflow'로 버전(예: 1.0.0)을 넣어 실행하거나, v로 시작하는 태그(예: v1.0.0)를 올리면 동작한다.
# - 세 자리(1.0.1)는 정식 회차로 Latest, 네 자리(1.0.0.1)는 테스트 회차로 Pre-release 가 된다.
# - 필요한 파일: dist/TabCustomizer-<버전>.zip, release-notes/v<버전>.md
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (정식 예: 1.0.1 · 테스트 예: 1.0.0.1)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"; else VERSION="${REF_NAME#v}"; fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::버전 형식이 올바르지 않습니다: $VERSION"; exit 1
          fi
          TAG="v${VERSION}"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then KIND="--prerelease"; else KIND="--latest"; fi
          ASSET="dist/TabCustomizer-${VERSION}.zip"
          NOTES="release-notes/${TAG}.md"
          test -f "$ASSET" || { echo "::error::$ASSET 파일이 없습니다"; exit 1; }
          test -f "$NOTES" || { echo "::error::$NOTES 파일이 없습니다"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG 릴리스가 이미 있습니다"; exit 1
          fi
          # 태그가 없으면 지금 실행 중인 커밋에 태그를 만들어 릴리스한다
          gh release create "$TAG" "$ASSET" --title "Tab Customizer ${VERSION}" --notes-file "$NOTES" --target "$GITHUB_SHA" $KIND
